<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique des Pizzas - React</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-light">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function PizzaApp() {
            const [pizzas, setPizzas] = useState([]);
            const [loading, setLoading] = useState(true);

            // Fetch history from our REST API
            const fetchPizzas = () => {
                fetch('/td5/api/pizzas')
                    .then(res => res.json())
                    .then(data => {
                        setPizzas(data);
                        setLoading(false);
                    })
                    .catch(err => console.error("Error fetching pizzas:", err));
            };

            useEffect(() => {
                fetchPizzas();
                // Refresh every 5 seconds to see new orders
                const interval = setInterval(fetchPizzas, 5000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="container py-5">
                    <div className="card shadow border-0">
                        <div className="card-header bg-primary text-white py-3">
                            <h2 className="mb-0 h4">🍕 Historique des Commandes</h2>
                        </div>
                        <div className="card-body">
                            {loading ? (
                                <div className="text-center py-4">Chargement...</div>
                            ) : pizzas.length === 0 ? (
                                <p className="text-muted text-center py-4">Aucune commande trouvée no serveur.</p>
                            ) : (
                                <div className="table-responsive">
                                    <table className="table table-hover align-middle">
                                        <thead className="table-light">
                                            <tr>
                                                <th># ID</th>
                                                <th>Pizza</th>
                                                <th className="text-center">Quantité</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {pizzas.map((p) => (
                                                <tr key={p.id}>
                                                    <td><span className="badge bg-secondary">#{p.id}</span></td>
                                                    <td className="fw-bold">{p.pizza}</td>
                                                    <td className="text-center">{p.quantite}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                        <div className="card-footer bg-white text-end">
                            <button className="btn btn-outline-primary btn-sm" onClick={fetchPizzas}>
                                Actualiser Maintenant
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PizzaApp />);
    </script>
</body>

</html>
