<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saisie Personne</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main>
    <div class='container-fluid'>
        <form id="SaisieForm" name="SaisieForm" action="RecuperationParametre" method="post">
            <div class='mb-3'>
                <label for='nom' class='form-label'>Nom de la Personne</label>
                <input type='text' class='form-control' id='nom' name='nom' aria-describedby='elementAideNom'></input>
                <div id='elementAideNom' class='form-text'>Entrez le nom de la personne</div>
                <label for='prenom' class='form-label'>Prénom de la Personne</label>
                <input type='text' class='form-control' id='prenom' name='prenom' aria-describedby='elementAidePrenom'></input>
                <div id='elementAidePrenom' class='form-text'>Entrez le prénom de la personne</div>
                <div class="form-check">
  					<input class="form-check-input" type="radio" name="TypeAffichage" id="navigateur" value="navigateur">
  					<label class="form-check-label" for="navigateur">
    				Navigateur
  					</label>
				</div>
				<div class="form-check">
  					<input class="form-check-input" type="radio" name="TypeAffichage" id="console" checked value="console">
  					<label class="form-check-label" for="console">
    				Console
  					</label>
				</div>
  			</div>
                <button type="submit" class="btn btn-primary mb-3">Ajout</button>
                <button type="button" id="clear" class="btn btn-danger mb-3">Clear</button>
            </div>   
        </form>
        </div>
  </main>
  <script>
	  
	    function clearField() {
            const champ = document.getElementById("nom");
            const champ1 = document.getElementById("prenom");
            champ.value = "";
            champ1.value = "";
        }
        const clearButton = document.getElementById("clear");
        clearButton.addEventListener('click', clearField);

  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
</body>
</html>
